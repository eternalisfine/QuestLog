services:
  db-primary:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_REPLICATION_MODE:      master
      POSTGRESQL_REPLICATION_USER:      replicator
      POSTGRESQL_REPLICATION_PASSWORD:  ${REPLICATION_PASSWORD}
      POSTGRESQL_USERNAME:              ${POSTGRES_USER}
      POSTGRESQL_PASSWORD:              ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE:              ${POSTGRES_DB}
    ports:
      - "5432:5432"   # for db debugging
    volumes:
      -pgdata:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_REPLICATION_MODE:      slave
      POSTGRESQL_MASTER_HOST:           db-primary
      POSTGRESQL_MASTER_PORT_NUMBER:    5432
      POSTGRESQL_REPLICATION_USER:      replicator
      POSTGRESQL_REPLICATION_PASSWORD:  ${REPLICATION_PASSWORD}
      POSTGRESQL_USERNAME:              ${POSTGRES_USER}
      POSTGRESQL_PASSWORD:              ${POSTGRES_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    ports:
      -"6379:6379"    # for redis debugging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  backend1: &backend
    build: ./backend
    volumes:
      - ./backend:/app  # mounting source
      - /app/venv       # not the local venv
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-primary:5432/${POSTGRES_DB}
      READ_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-replica:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend2:
    <<: *backend

  backend3:
    <<: *backend

  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3


volumes:
  pgdata: